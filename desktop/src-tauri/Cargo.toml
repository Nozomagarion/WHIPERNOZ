[package]
name = "whipernoz-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "whipernoz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whipernoz-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
whipernoz-core = { path = "../../crates/whipernoz-core" }
whipernoz-audio = { path = "../../crates/whipernoz-audio" }
whipernoz-accessibility = { path = "../../crates/whipernoz-accessibility" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
