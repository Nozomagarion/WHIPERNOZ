[workspace]
members = [
    "crates/whipernoz-core",
    "crates/whipernoz-audio",
    "crates/whipernoz-accessibility",
    "desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
